const B = 'subjects.butler[season=2022-23].measures.';
const D = {
  regMpg: FT.value(B + 'regular.mpg'), poMpg: FT.value(B + 'playoffs.mpg'),
  reg36: FT.value(B + 'regular.points_per_36'), po36: FT.value(B + 'playoffs.points_per_36'),
  regPpg: FT.value(B + 'regular.ppg'), poPpg: FT.value(B + 'playoffs.ppg'),
  minutesPart: FT.value(B + 'ppg_decomposition.minutes_component'), ratePart: FT.value(B + 'ppg_decomposition.rate_component'),

D.minutesOnly = D.poMpg * D.reg36 / 36;                 // width grown, height not yet settled (derived)
const PRE = 0.5;                                         // S02's last frame holds before the word "rectangle"
const countEase = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3.2);
const op = (t, inAt, outAt, dur = 0.25) => FT.p(t, inAt, dur) * (outAt == null ? 1 : 1 - FT.p(t, outAt, dur));
const mix = (a, b, p) => 'rgb(' + a.map((v, i) => Math.round(FT.lerp(v, b[i], p))).join(',') + ')';

const text = (f, cls, s, html) => FT.el(f, cls, s, html);
// Dashed guide lines as SVG paths: 2px strokes centred on whole pixels, dash 10 on / 8 off.
// Each segment's dash unit is fitted to its length so every line ends on a dash; a segment that
// continues from a corner starts with a gap, so the rhythm never doubles up at a join.
const NS = 'http://www.w3.org/2000/svg';
const fit = (length, fromCorner) => {
  const n = Math.max(1, Math.round(fromCorner ? length / 18 : (length + 8) / 18));
  const u = fromCorner ? length / (18 * n) : length / (18 * n - 8);
  return { dash: (10 * u) + ' ' + (8 * u), offset: fromCorner ? 10 * u : 0 };
};
const dashed = (f, segments) => {   // segments: [x1, y1, x2, y2, fromCorner]
  const svg = document.createElementNS(NS, 'svg');
  Object.assign(svg.style, { position: 'absolute', left: '0', top: '0', overflow: 'visible' });
  svg.setAttribute('width', '1'); svg.setAttribute('height', '1');
  segments.forEach(([x1, y1, x2, y2, fromCorner]) => {
    const d = fit(Math.hypot(x2 - x1, y2 - y1), fromCorner), line = document.createElementNS(NS, 'line');
    Object.entries({ x1, y1, x2, y2, stroke: '#675F53', 'stroke-width': 2, 'stroke-dasharray': d.dash,
                     'stroke-dashoffset': d.offset, 'shape-rendering': 'crispEdges' }).forEach(([k, v]) => line.setAttribute(k, v));
    svg.appendChild(line);
  });
  f.appendChild(svg);
  return svg;
};

FT.scene({ duration: { landscape: PRE + 12.5, vertical: 9 }, background: 'paper', formats: {

    FT.el(f, '', { left: '1060px', top: '770px', width: '760px', display: 'flex', alignItems: 'flex-start', gap: '18px' },

    FT.source(f, [['SOURCE', 'Basketball-Reference · 2022–23 regular season vs playoffs · per game, play-in excluded']], { x: 96, y: 930, width: 1728, size: 24 }),

    text(f, '', mono(26), 'WIDTH · MIN / GAME'), FT.el(f, '', { width: '2px', height: '12px', background: 'var(--ink)' }),

  ];
  [[216, 256], [96, Y0 - regH - 16], [216, 876], [X0 + regW - 1, Y0], [X0 + regW - 60, 876]].forEach(([x, y], i) => {
    lab1[i].style.left = px(x); lab1[i].style.top = px(y);
  });
  const zero = text(f, '', mono(26, 400, null, { left: '96px', top: px(Y0 - 16), width: '104px', textAlign: 'right' }), '0');
  const wlab = [FT.el(f, '', { left: px(X0 + poW - 1), top: px(Y0), width: '2px', height: '12px', background: 'var(--ink)' }),

  const area = text(f, 'number', { lineHeight: '1' });

  const zoomLink = FT.el(f, '', { left: '772px', top: px(Y0 - regH + 4), width: '128px', height: '2px', background: 'var(--ink)', transformOrigin: 'left' });
  const Z = (v) => Math.round(438 - (v - 24) * 330);    // inset scale: x15, 24.0 to 25.0 points per 36
  const inset = FT.el(f, '', { left: '900px', top: '290px', width: '924px', height: '560px', boxSizing: 'border-box', border: '2px solid var(--ink)',

    '<div style="position:absolute;left:22px;top:14px;font-family:var(--mono);font-size:26px;color:var(--field-text)">ZOOM ×15 · 24.0 – 25.0 PTS / 36</div>' +
    '<div style="position:absolute;left:88px;top:108px;width:620px;border-top:2px dashed var(--rule-light)"></div>' +
    '<div style="position:absolute;left:88px;top:438px;width:620px;border-top:2px dashed var(--rule-light)"></div>' +
    '<div style="position:absolute;left:22px;top:94px;font-family:var(--mono);font-size:26px;color:var(--field-text)">25.0</div>' +
    '<div style="position:absolute;left:22px;top:424px;font-family:var(--mono);font-size:26px;color:var(--field-text)">24.0</div>' +
    '<div class="zbars" style="position:absolute;inset:0">' +
    '<div style="position:absolute;left:98px;top:' + Z(D.reg36) + 'px;width:240px;height:' + (567 - Z(D.reg36)) + 'px;background:var(--field)"></div>' +
    '<div style="position:absolute;left:398px;top:' + Z(D.po36) + 'px;width:240px;height:' + (567 - Z(D.po36)) + 'px;background:var(--player-a)"></div>' +
    '<div style="position:absolute;left:98px;top:' + (Z(D.reg36) + 17) + 'px;width:240px;text-align:center;font-family:var(--mono);font-weight:600;font-size:40px;line-height:1;color:var(--ink)">' + FT.fmt(D.reg36, 1) + '</div>' +
    '<div style="position:absolute;left:398px;top:' + (Z(D.po36) + 17) + 'px;width:240px;text-align:center;font-family:var(--mono);font-weight:600;font-size:40px;line-height:1;color:var(--ink)">' + FT.fmt(D.po36, 1) + '</div></div>' +
    '<div class="zbracket" style="position:absolute;inset:0">' +
    '<div style="position:absolute;left:98px;top:' + (Z(D.reg36) - 1) + 'px;width:600px;border-top:2px dashed var(--ink)"></div>' +
    '<div style="position:absolute;left:678px;top:' + Z(D.reg36) + 'px;width:3px;height:' + (Z(D.po36) - Z(D.reg36)) + 'px;background:var(--ink)"></div>' +

    '<div style="position:absolute;left:670px;top:' + (Z(D.po36) - 2) + 'px;width:19px;height:3px;background:var(--ink)"></div>' +
    '<div style="position:absolute;left:708px;top:' + (Z(D.reg36) + 3) + 'px;display:flex;flex-direction:column;gap:6px;font-family:var(--mono)">' +
    '<div style="font-weight:600;font-size:56px;line-height:1;color:var(--ink)">' + FT.fmt(D.po36 - D.reg36, 1) + '</div>' +
