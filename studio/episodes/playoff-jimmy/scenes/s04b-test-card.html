<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../render/fonts/fonts.css"><link rel="stylesheet" href="../../../render/system.css">
<script src="../../../render/system.js"></script><script src="data.js"></script>
<title>S04b the test, written down first</title></head><body><script>
// S04b (Paper): the pre-registered test, with the commit that fixed it before any league data existed (git, via data.js meta).
const commit = FT.meta('preregistration_commit'), date = FT.meta('preregistration_date');
FT.scene({ duration: 9, background: 'paper', formats: { landscape: (f) => {
  const kicker = FT.kicker(f, 'Written down before the data', { x: 96, y: 96, size: 30 });
  const claim = FT.claim(f, ['The test, written down first'], { x: 96, y: 150, size: 112 });
  const rule = FT.el(f, '', { left: '96px', top: '320px', width: '1728px', height: '3px', background: 'var(--ink)', transformOrigin: 'left' });
  const rows = [['Compare', 'each playoff run with every player who played <em>real minutes</em> that season.'],
                ['Call it real', 'only if he beats the typical player <em>on average and in most seasons</em>.'],
                ['Every version', 'must pass: against all players and against 20-point scorers, at 100 and at 200 playoff minutes.']].map(([k, v], i) => [
    FT.el(f, 'label', { left: '96px', top: (370 + i * 110) + 'px', width: '300px', fontSize: '30px', fontWeight: '600', color: 'var(--ink)' }, k),
    FT.el(f, 'caption', { left: '420px', top: (360 + i * 110) + 'px', width: '1400px', fontSize: '44px' }, v)]);
  const stamp = FT.el(f, '', { left: '1110px', top: '700px', border: '3px solid var(--ink)', padding: '14px 22px', fontFamily: 'var(--mono)', color: 'var(--ink)' },
    '<div style="font-size:32px;font-weight:600;letter-spacing:0.06em">COMMITTED ' + date + ' · ' + commit + '</div>' +
    '<div style="font-size:24px;letter-spacing:0.06em;color:var(--field-text);margin-top:6px">BEFORE ANY LEAGUE DATA WAS DOWNLOADED</div>');
  FT.source(f, [['SOURCE', 'the project\'s git history: METHOD.md · real minutes = at least 1,500 regular-season and 100 playoff minutes']],
            { x: 96, y: 936, width: 1728, size: 24 });
  return (t) => {
    FT.rise(kicker, t, 0); claim.at(t, 0.2);
    rule.style.transform = 'scaleX(' + FT.p(t, 0.8, 0.5) + ')';
    rows.forEach(([k, v], i) => { FT.rise(k, t, 1.2 + i * 0.9); FT.cut(v, t, 1.2 + i * 0.9); });
    const ps = FT.p(t, 4.6, 0.35);
    stamp.style.opacity = ps; stamp.style.transform = 'rotate(-3deg) scale(' + FT.lerp(1.25, 1, ps) + ')';
  };
} } });
</script></body></html>
