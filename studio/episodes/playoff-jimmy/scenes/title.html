<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../render/fonts/fonts.css"><link rel="stylesheet" href="../../../render/system.css">
<script src="../../../render/system.js"></script><script src="data.js"></script>
<title>S01 title card</title></head><body><script>
// S01 title card (Night). Design system sample frame 1; no data values.
const STAR = '<svg viewBox="0 0 100 100" style="width:100%;height:100%"><path d="M50 0 L55 42 L85 15 L58 45 L100 50 L58 55 L85 85 L55 58 L50 100 L45 58 L15 85 L42 55 L0 50 L42 45 L15 15 L45 42 Z" fill="currentColor"/></svg>';
FT.scene({ duration: 6, background: 'night', formats: { landscape: (f) => {
  FT.el(f, '', { left: '1020px', top: '40px', width: '1100px', height: '1100px' },
    '<svg viewBox="0 0 100 100" width="1100" height="1100" fill="none" stroke="#2A2622" stroke-width="0.35"><rect x="30" y="-2" width="40" height="58"/><circle cx="50" cy="56" r="20"/><path d="M6 -2 V30 A44 44 0 0 0 94 30 V-2"/></svg>');
  const disc = FT.el(f, '', { left: '1180px', top: '180px', width: '720px', height: '720px', borderRadius: '50%', background: 'var(--player-a)',
    webkitMask: 'radial-gradient(circle,#000 7px,transparent 7.6px) 0 0/22px 22px', mask: 'radial-gradient(circle,#000 7px,transparent 7.6px) 0 0/22px 22px' });
  const ball = FT.el(f, '', { left: '1260px', top: '260px', width: '560px', height: '560px' },
    '<div style="position:absolute;inset:0;border-radius:50%;background:var(--player-a)"></div><svg viewBox="0 0 560 560" width="560" height="560" style="position:absolute;inset:0" fill="none" stroke="#1C1916" stroke-width="10"><path d="M0 280 H560"/><path d="M280 0 V560"/><path d="M82 82 C200 200 200 360 82 478"/><path d="M478 82 C360 200 360 360 478 478"/></svg>');
  const q = FT.el(f, 'number', { left: '1520px', top: '480px', fontSize: '64px', background: 'var(--paper)', color: 'var(--ink)', padding: '8px 18px', letterSpacing: '0' }, '?');
  const stars = [[1170, 150, 120, 'var(--paper)'], [1760, 760, 84, 'var(--paper)'], [1790, 210, 56, 'var(--accent)']].map(([x, y, w, c]) =>
    FT.el(f, '', { left: x + 'px', top: y + 'px', width: w + 'px', height: w + 'px', color: c }, STAR));
  const kicker = FT.kicker(f, 'Investigation 01 · NBA', { x: 96, y: 190, size: 30, color: 'var(--accent)' });
  const claim = FT.claim(f, ['Is <span style="color:var(--player-a)">Playoff</span>', 'Jimmy real?'], { x: 90, y: 260, size: 200, lh: 0.86, color: 'var(--paper)' });
  const caption = FT.el(f, 'caption', { left: '96px', top: '800px', width: '960px', fontSize: '44px', fontStyle: 'italic', color: 'var(--paper)' },
    'More points when it counts. Or just <em>more minutes</em>?');
  return (t) => {
    FT.rise(kicker, t, 0);
    claim.at(t, 0.2);
    const pd = FT.p(t, 0.7, 0.6), pb = FT.p(t, 0.9, 0.6);
    disc.style.opacity = pd; disc.style.transform = 'scale(' + FT.lerp(0.92, 1, pd) + ')';
    ball.style.opacity = pb; ball.style.transform = 'scale(' + FT.lerp(0.9, 1, pb) + ') rotate(' + FT.lerp(-25, 0, pb) + 'deg)';
    stars.forEach((s, i) => { const p = FT.p(t, 1.3 + i * 0.12, 0.4); s.style.opacity = p; s.style.transform = 'scale(' + p + ')'; });
    const pq = FT.p(t, 1.7, 0.5);
    q.style.opacity = pq; q.style.transform = 'rotate(' + (-4 - 3 * Math.sin(Math.PI * Math.min(pq, 1))) + 'deg)';
    FT.cut(caption, t, 2.2);
  };
} } });
</script></body></html>
