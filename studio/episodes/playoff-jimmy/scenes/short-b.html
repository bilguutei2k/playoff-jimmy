<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../render/fonts/fonts.css"><link rel="stylesheet" href="../../../render/system.css">
<script src="../../../render/system.js"></script><script src="data.js"></script>
<title>Short B most players shrink</title></head><body><script>
// Short B frame (vertical, Paper). Numbers: PJ-C005 (his seasons' typical fall, his pooled change, runs).
const K = 'benchmark.butler.career.A_100.';
const typical = FT.value(K + 'minute_weighted_peer_median'), his = FT.value(K + 'pooled_excess_per_36'), runs = FT.value(K + 'n_eligible_seasons');
FT.scene({ duration: 9, background: 'paper', formats: { vertical: (f) => {
  const kicker = FT.kicker(f, 'Playoff Jimmy · 2 / 3', { x: 72, y: 220, size: 38 });
  const claim = FT.claim(f, ['Most players slip.', '<span style="color:var(--player-a)">He slips less.</span>'], { x: 66, y: 286, size: 116 });
  const rule = FT.el(f, '', { left: '72px', top: '560px', width: '848px', height: '3px', background: 'var(--ink)' });
  const l1 = FT.el(f, 'label', { left: '72px', top: '600px', fontSize: '38px', color: 'var(--field-text)' }, 'Typical player, same seasons');
  const n1 = FT.el(f, 'number', { left: '60px', top: '646px', fontSize: '250px', color: 'var(--field-text)' });
  const l2 = FT.el(f, 'label', { left: '72px', top: '915px', fontSize: '38px', color: 'var(--player-a-text)' }, 'Butler, ' + runs + ' qualifying runs');
  const n2 = FT.el(f, 'number', { left: '60px', top: '961px', fontSize: '250px', color: 'var(--player-a)' });
  const chip = FT.el(f, 'claim chip', { left: '560px', top: '1222px', fontSize: '68px', padding: '10px 18px', lineHeight: '1' }, 'Slips less');
  const unit = FT.el(f, 'label', { left: '72px', top: '1240px', fontSize: '38px', color: 'var(--ink)' }, 'Points per 36');
  const caption = FT.el(f, 'caption', { left: '72px', top: '1336px', width: '848px', fontSize: '52px', color: 'var(--ink)' },
    'Not every year: against similar scorers, <em>close to a coin flip</em>.');
  FT.source(f, [['SCOPE', '1,500+ regular, 100+ playoff min'], ['RUNS', '2012–13 to 2024–25'], ['SOURCE', 'Basketball-Reference']],
            { x: 72, y: 1500, width: 848, size: 32 });
  return (t) => {
    FT.rise(kicker, t, 0);
    claim.at(t, 0.3);
    rule.style.transform = 'scaleX(' + FT.p(t, 1.2, 0.5) + ')'; rule.style.transformOrigin = 'left';
    FT.rise(l1, t, 1.5);
    const p1 = FT.p(t, 1.6, 0.7);
    n1.style.opacity = t >= 1.6 ? 1 : 0; n1.textContent = FT.fmt(FT.lerp(0, typical, p1), 1);
    FT.rise(unit, t, 1.6);
    FT.rise(l2, t, 3.0);
    const p2 = FT.p(t, 3.1, 0.7);
    n2.style.opacity = t >= 3.1 ? 1 : 0; n2.textContent = FT.fmt(FT.lerp(0, his, p2), 2);
    const pk = FT.p(t, 4.3, 0.5);
    chip.style.opacity = Math.min(1, pk * 2);
    chip.style.transform = 'rotate(' + (-4 - 3 * Math.sin(Math.PI * pk)) + 'deg) scale(' + FT.lerp(0.85, 1, pk) + ')';
    FT.cut(caption, t, 5.5);
  };
} } });
</script></body></html>
